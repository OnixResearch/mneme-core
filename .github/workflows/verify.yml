# Verification gates for the public engine.
#
# Runs three independent jobs on every push to main, every pull request, and on
# demand:
#   - `nix-flake-check`: sandboxed `nix flake check` (Rust checks, fmt, Octet).
#   - `kernel-proofs`: Charon/Aeneas/Lean proof gate (`just proofs`) with a
#     cached `proofs/kernel/.lake` directory.
#   - `patchbay`: Linux-namespace fault-injection sync tests with
#     `MNEME_REQUIRE_PATCHBAY=1` (fails closed if `nft`, `tc`, or userns are
#     unavailable).
#
# No repository secret is used. Every job needs only the default read-only
# workflow token and public inputs. See the transitive source rewrite below.
name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Check out the verification subject.

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nix-flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Refuse credential-bearing flake inputs
        run: |
          if grep -n 'ssh://' flake.lock; then
            echo "::error::flake.lock pins an SSH input and this job has no credentials"
            exit 1
          fi

      - name: Reclaim runner disk
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h / /tmp

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          install_url: https://releases.nixos.org/nix/nix-2.36.0/install

      # The pinned Octet UI library fetches bounded-exec directly with an SSH
      # URL (not through its flake lock). Keep its exact revision and hash.
      - name: Fetch the public bounded-exec source without an SSH key
        run: |
          git config --global url."https://github.com/OnixResearch/bounded-exec.git".insteadOf \
            "ssh://git@github.com/OnixResearch/bounded-exec.git"

      - name: Run the repository's Nix gates
        run: >-
          nix flake check
          --no-update-lock-file
          --keep-going
          --max-jobs 2
          --print-build-logs

  kernel-proofs:
    name: kernel proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Refuse credential-bearing flake inputs
        run: |
          if grep -n 'ssh://' flake.lock; then
            echo "::error::flake.lock pins an SSH input and this job has no credentials"
            exit 1
          fi

      - name: Reclaim runner disk
        run: |
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          df -h / /tmp

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          install_url: https://releases.nixos.org/nix/nix-2.36.0/install

      - name: Fetch the public bounded-exec source without an SSH key
        run: |
          git config --global url."https://github.com/OnixResearch/bounded-exec.git".insteadOf \
            "ssh://git@github.com/OnixResearch/bounded-exec.git"

      - name: Cache Lean Lake build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proofs/kernel/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('proofs/kernel/lakefile.toml', 'proofs/kernel/lake-manifest.json', 'proofs/kernel/lean-toolchain', 'flake.lock') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: Run kernel proof gate
        run: nix develop --no-update-lock-file --command just proofs

  patchbay:
    name: patchbay network tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Refuse credential-bearing flake inputs
        run: |
          if grep -n 'ssh://' flake.lock; then
            echo "::error::flake.lock pins an SSH input and this job has no credentials"
            exit 1
          fi

      - name: Install Linux namespace network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iproute2 nftables
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          export PATH="$PATH:/usr/sbin:/sbin"
          nft --version
          tc -V

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          install_url: https://releases.nixos.org/nix/nix-2.36.0/install

      - name: Fetch the public bounded-exec source without an SSH key
        run: |
          git config --global url."https://github.com/OnixResearch/bounded-exec.git".insteadOf \
            "ssh://git@github.com/OnixResearch/bounded-exec.git"

      - name: Run fail-closed patchbay sync tests
        run: >-
          nix develop --no-update-lock-file --command bash -euo pipefail -c
          'export PATH="$PATH:/usr/sbin:/sbin"; MNEME_REQUIRE_PATCHBAY=1 cargo test --locked -p mneme-sync --test patchbay'
