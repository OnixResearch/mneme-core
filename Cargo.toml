[workspace]
resolver = "3"
members = [
  "crates/mneme-core",
  "crates/mneme-store",
  "crates/mneme-memory",
  "crates/mneme-consolidation",
  "crates/mneme-prolog",
  "crates/mneme-retention",
  "crates/mneme-doc",
  "crates/mneme-datalog",
  "crates/mneme-recall",
  "crates/mneme-api",
  "crates/mneme-desktop",
  "crates/mneme-eval",
  "crates/mneme-cli",
]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
mneme-core = { path = "crates/mneme-core" }
mneme-store = { path = "crates/mneme-store" }
mneme-memory = { path = "crates/mneme-memory" }
mneme-consolidation = { path = "crates/mneme-consolidation" }
mneme-prolog = { path = "crates/mneme-prolog" }
mneme-retention = { path = "crates/mneme-retention" }
mneme-doc = { path = "crates/mneme-doc" }
mneme-datalog = { path = "crates/mneme-datalog" }
mneme-recall = { path = "crates/mneme-recall" }
mneme-api = { path = "crates/mneme-api" }
mneme-desktop = { path = "crates/mneme-desktop" }
mneme-eval = { path = "crates/mneme-eval" }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"

# Octet runner policy. Lint tuning lives in dylint.toml (consumer-owned).
# First adoption scope is the pure core crate; extending it is a reviewed change.
[workspace.metadata.octet]
default_scope = ["-p", "mneme-core"]
cargo_check_args = ["--lib", "--ignore-rust-version"]
