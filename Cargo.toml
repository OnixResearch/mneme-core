[workspace]
resolver = "3"
members = [
  "crates/mneme-core",
  "crates/mneme-store",
  "crates/mneme-memory",
  "crates/mneme-retention",
  "crates/mneme-eval",
  "crates/mneme-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
mneme-core = { path = "crates/mneme-core" }
mneme-store = { path = "crates/mneme-store" }
mneme-memory = { path = "crates/mneme-memory" }
mneme-retention = { path = "crates/mneme-retention" }
mneme-eval = { path = "crates/mneme-eval" }
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
