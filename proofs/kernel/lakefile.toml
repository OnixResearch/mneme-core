name = "mneme_kernel_proofs"
defaultTargets = ["MnemeKernel", "MnemeKernelProofs"]
# Mathlib arrives through the pinned Aeneas backend and is written for the
# module system; these proof files are not module-system files.
allowNonModules = true

# The Aeneas Lean library the generated translation and the proofs build
# against. The extractor that produces MnemeKernel.lean is pinned separately in
# scripts/verify-kernel-proofs.mjs.
[[require]]
name = "aeneas"
git = { url = "https://github.com/AeneasVerif/aeneas", subDir = "backends/lean" }
rev = "1238879f9ea550512096e9bf8bd6fe7407b3eaef"

# Generated by Aeneas from crates/mneme-kernel. Never edited by hand.
[[lean_lib]]
name = "MnemeKernel"

# Theorems over the generated translation.
[[lean_lib]]
name = "MnemeKernelProofs"
