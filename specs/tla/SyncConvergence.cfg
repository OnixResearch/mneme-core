SPECIFICATION Spec

CONSTANTS
    Peers = {"p1", "p2", "p3"}
    Scopes = {"s1", "s2"}
    Records = {"r1", "r2"}
    Tokens = {"t1", "t2"}
    MaxSeq = 2
    MaxTime = 1
    TokenScope <- DefaultTokenScope
    TokenExpiry <- DefaultTokenExpiry
    TokenHolder <- DefaultTokenHolder
    EnablePushMonotonic = TRUE
    EnableRevocationMerge = TRUE

INVARIANTS
    TypeOK
    PushHeadMonotonic
    NoForgottenResurrection
    NoCrossScopeLeakage
    RevokedAndExpiredRejected
    CalmSealBounded

PROPERTIES
    RevocationsEventuallyConverge
