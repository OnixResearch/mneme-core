SPECIFICATION Spec

CONSTANTS
    Blobs = {"b1", "b2"}
    Chunks = {"c1", "c2", "c3"}
    BlobChunkMap <- DefaultBlobChunkMap
    MaxSeq = 3
    MaxGen = 2
    EnableChunkGC = TRUE
    EnableGenPin = TRUE

INVARIANTS
    TypeOK
    LockExclusion
    NoLeakedUnreferencedChunks
    LiveBlobsDurable
    CacheGenerationSoundness
    GenerationPinnedCommit
    QuarantineNoDataLoss
    StaleIntentNotPublished

PROPERTIES
    PendingIntentsEventuallyResolve
    OrphansEventuallyReclaimed
