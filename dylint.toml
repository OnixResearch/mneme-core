# Consumer-owned Octet configuration for the strict required check.
#
# Runner scope lives in Cargo.toml:
#   [workspace.metadata.octet]
#   default_scope = ["--workspace"]
#   cargo_check_args = ["--all-targets", "--all-features", "--ignore-rust-version"]
#
# The gate covers every workspace crate and target. This profile keeps the
# high-signal families at deny and disables the families listed below; that is
# temporary rollout debt, not permanent policy, and it is not a claim that every
# lint is clean. The full-catalog ratchet (`octet-all`, which copies
# dylint-all.toml over this file and records accepted debt in
# octet-baseline.json) is the profile that registers every lint; this file is
# the narrower required check that fails the build.

[octet]
disabled_lints = [
  "function_length",
  "acronym_style",
  "numeric_units",
  "unbounded_loop",
  "compound_condition",
  "verified_purity",
  "ambient_env",
  "ambient_random",
  "global_state_in_core",
  "impure_call_in_core",
  "interior_mutability_in_core",
  "logging_in_core",
  "missing_const_fn",
  "mutating_input_in_pure",
  "nondeterministic_output",
  "pure_attr_contract",
  "resource_return_from_core",
  "spawn_in_core",
  "zero_alloc_attr_contract",
  "unjustified_allow",
  "nested_conditionals",
  "assertion_density",
  "multi_lock_ordering",
  "ignored_join_handle",
  "unbounded_collection_growth",
  "sentinel_fallback",
  "too_many_parameters",
  "fat_trait",
  "concrete_construction_in_core",
  "type_accumulation",
  "bool_naming",
  "ignored_result",
  "unchecked_narrowing",
  "unchecked_division",
  "catch_all_on_enum",
  "foreign_enum_catch_all",
  "fragile_exhaustive_enum_match",
  "platform_dependent_cast",
  "borrowed_argument_types",
  "deref_polymorphism",
  "clone_then_borrow",
  "allocation_in_loop",
  "float_for_currency",
  "ambiguous_params",
  "primitive_domain_alias",
  "raw_domain_value",
  "newtype_invariant_bypass",
  "raw_arithmetic_overflow",
  "no_unwrap",
  "no_panic",
  "public_unsafe_api",
  "defaulting_trait_method",
  "no_todo",
  "unjustified_no_todo_allow",
  "no_recursion",
  # Structural style families deferred until the core is decomposed; these are
  # the same high-noise families other consumers defer during rollout.
  "explicit_defaults",
  "non_trait_imports",
  "path_segment_repetition",
  "excessive_file_length",
  "module_file_count",
  # No `use ... as` aliases remain in crates/*/src, so this entry no longer
  # suppresses anything; it is kept only until the all-lint ratchet owns this
  # profile and removes the dead entry.
  "renamed_imports",
  # No `_` module filenames remain in crates/*/src either; obsolete for the same
  # reason.
  "underscore_in_module_filename",
]

# Gate semantics: the 62 lints disabled above plus the 15 below account for all
# 77 the pinned runner registers. The eight deny-level lints fail the check on a
# finding. The seven Octet leaves at warn are named explicitly because Octet maps
# warn-level findings to exit 0: they are visible here, but only `octet-all`
# fails on them.
[octet.lint_levels]
ambient_clock = "deny"
compound_assertion = "deny"
contradictory_time = "deny"
unbounded_channel = "deny"
negated_predicate = "deny"
raw_bool_parameter = "deny"
usize_in_public_api = "deny"
fallible_int_fallback = "deny"
discarded_sync_result = "warn"
drop_must_use = "warn"
flush_only_durability = "warn"
magic_number = "warn"
raw_bool_parameter_suppression = "warn"
retry_sync_after_error = "warn"
state_machine_exhaustiveness = "warn"
